# Font (matches Konsole "The Good One" profile)
font_family UbuntuSansMono Nerd Font Mono
font_size 10

# Full kitty keyboard protocol: gives <C-BS>, <S-CR>, etc. distinct escape
# sequences so neovim/opencode can bind them (Konsole conflates these with
# plain Backspace/Enter).
keyboard_protocol kitty

# Breeze colorscheme (ported from konsole Breeze.colorscheme; Intense variants
# used for bright colors, matching Konsole's "intense" rendering)
foreground            #fcfcfc
background            #232627
selection_foreground  #fcfcfc
selection_background  #1d99f3

color0  #232627
color1  #ed1515
color2  #11d116
color3  #f67400
color4  #1d99f3
color5  #9b59b6
color6  #1abc9c
color7  #fcfcfc
color8  #7f8c8d
color9  #c0392b
color10 #1cdc9a
color11 #fdbc4b
color12 #3daee9
color13 #8e44ad
color14 #16a085
color15 #ffffff
